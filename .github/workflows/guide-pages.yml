# Does the HTML guide (html-guide/) still compile on a clean machine?
#
# THIS WORKFLOW PUBLISHES NOTHING.  On every push to main that changes the
# guide, the studio's renderer it draws with, the language registry, the
# fonts, MathJax, the phone app's icons or the list of Parseh's addresses
# (lib/project.py), it compiles the guide exactly as it is published -- the
# front page, assets/, lib/icons/ and the compiled site/ in one folder, with
# the slim bar that leads to the website -- and fails if that does not build.
# Standard library only: setup-python is all it needs.  fonts-texgyre gives
# the pages the TeX Gyre faces the studio's sheet is set in; without them
# they fall back to Palatino and the like.
#
# THE GUIDE IS PUBLISHED FROM ANOTHER REPOSITORY, by a workflow that only
# its owner runs, by hand: the repository parseh-io/guide
# (project.GUIDE_REPO), "publish the guide" -> Run workflow.  It checks this
# repository out at main, runs the same compile, and puts the result at
# https://parseh.io/guide (project.GUIDE_URL): the repository's NAME is the
# address, and the organisation's domain serves it.  GitHub Pages is
# therefore OFF in this repository; an account that wants its own copy of the
# guide on its own Pages (https://<account>.github.io/Parseh/) turns it on
# in its own fork and runs a publishing workflow of its own (the guide's
# writing-this-guide/compiling.md says how).
name: guide compiles

on:
  push:
    branches: [main]
    paths:
      - "html-guide/**"
      - "markdown/exlex/**"
      - "markdown/app/htmlgen.py"
      - "markdown/app/static/**"
      - "lib/languages.*"
      - "lib/fonts/**"
      - "lib/icons/**"
      - "lib/mathjax/**"
      - "lib/mathjax.*"
      - "lib/project.py"
      - ".github/workflows/guide-pages.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The TeX Gyre fonts
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-texgyre || true
      - name: Compile the guide
        run: python3 html-guide/build.py --pages _site
